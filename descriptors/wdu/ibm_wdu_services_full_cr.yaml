        ## Define scaleup/scaledown sections to control how fast and how often scaling happens.
        ## These sections are optional; if they are not defined, the default values are set.
        scaleup:  # policy is Pod
          # the maximum number of pods that the HPA is allowed to add during each periodSeconds interval, default value is 1
          policies_pods_value: "<Optional>"
          # defines how often the HPA can apply a scaling action, default value is 15 (seconds)
          policies_pods_period_seconds: "<Optional>"
          # cooldown window before applying scaleUp action, default value is 30 (seconds)
          stabilization_window_seconds: "<Optional>"
        scaledown:
          # the maximum number of pods that the HPA is allowed to remove during each periodSeconds interval, default value is 1
          policies_pods_value: "<Optional>"
          # defines how often the HPA can apply a scaling action, default value is 15 (seconds)
          policies_pods_period_seconds: "<Optional>"
          # cooldown window before applying scaleDown action, default value is 300 (seconds)
          stabilization_window_seconds: "<Optional>"

      node_affinity:
        #-------------------------------------
        # custom_node_selector_match_expression will be added in node selector match expressions.
        # It accepts array list inputs. You can assign multiple selector match expressions except (kubernetes.io/arch)
        # Example value:
        # - key: kubernetes.io/hostname
        #   operator: In
        #   values:
        #     - worker0
        #     - worker1
        #     - worker3
        #-------------------------------------
        custom_node_selector_match_expression: [ ]
      ## Values in this field will be used as annotations in all generated pods, and it must be valid annotation key value pairs.
      # Example:
      # customAnnotationKey: customAnnotationValue
      ## To include '{{ }}' in annotation like '{{example}}', add a backward slash before curly brace like '\{\{example\}\}'.
      custom_annotations: { }
      ## Values in this field will be used as labels in all generated pods, and it must be valid label key value pairs
      # Example:
      # customLabelKey: customLabelValue
      custom_labels: { }

      ## Tolerations are specified in the pod specification to allow the pod to be scheduled on tainted nodes.
      ## Example, if you want to schedule the pod on a node with taints, you can add tolerations to the pod specification.
      ## tolerations:
      ##   - key: "component"
      ##     operator: "Equal"
      ##     value: "css"
      ##     effect: "NoSchedule"
      ## Default is empty list [], which uses Kubernetes defaults.
      tolerations: [ ]