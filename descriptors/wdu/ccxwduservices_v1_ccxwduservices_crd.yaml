              license:
                description: |-
                  License holds the IBM product license acceptance for CCXWDUServices.
                  Must be set to accept: true before deploying.
                properties:
                  accept:
                    description: Accept the license terms. Must be set to true.
                    enum:
                    - true
                    type: boolean
                required:
                - accept
                type: object
              shared_configuration:
                description: SharedConfiguration contains settings shared across all
                  IBM Content Cortex AI Services components.
                properties:
                  image_pull_secrets:
                    description: |-
                      ImagePullSecrets is the list of image pull secret names shared by all CP4A component pods to pull images.
                      All CP4A components must use/share these secrets (e.g. ibm-entitlement-key).
                    items:
                      type: string
                    type: array
                  root_ca_secret:
                    description: RootCaSecret is the secret used to sign all CP4A
                      internal certificates for service communication.
                    type: string
                  sc_ccx_license_model:
                    description: |-
                      ScFncmLicenseModel specifies the licensing model for the product being installed.
                      Choose one of the following values based on the product edition:

                      IBM Content Cortex Essentials:
                        CCx.Ess.AU, CCx.Ess.EP, CCx.EE

                      IBM Content Cortex Restricted:
                        CCx.AR, CCx.PR, CCx.ER

                      IBM Content Cortex Premium: 
                        CCx.Pre.AU, CCx.Pre.EP, CCx.Pre.EE.
                      
                      IBM Content Cortex General license: 
                        Premium, Essentials

                      IBM Cloud Pak for Business Automation:
                        CP4BA.NonProd, CP4BA.Prod, CP4BA.User
                    enum:
                    - CCx.Ess.AU
                    - CCx.Ess.EP
                    - CCx.EE
                    - CCx.AR
                    - CCx.PR
                    - CCx.ER
                    - CP4BA.NonProd
                    - CP4BA.Prod
                    - CP4BA.User
                    - CCx.Pre.AU
                    - CCx.Pre.EP
                    - CCx.Pre.EE
                    - Premium
                    - Essentials
                    type: string
                  sc_deployment_context:
                    default: CP4A
                    description: ScDeploymentContext is the deployment context. Default
                      value is CP4A.
                    type: string
                  sc_deployment_hostname_suffix:
                    description: |-
                      ScDeploymentHostnameSuffix is the hostname suffix used for Route/Ingress host construction.
                      For OCP/ROKS: optional — if unset the operator auto-discovers the cluster ingress domain
                      via a probe Route. The final Route host will be ccxwdu-<namespace>.<suffix>.
                      For other (CNCF): required for Ingress creation.
                    type: string
                  sc_deployment_platform:
                    description: 'ScDeploymentPlatform specifies the target platform.
                      Possible values: OCP, ROKS, other.'
                    enum:
                    - OCP
                    - ROKS
                    - other
                    type: string
                  sc_deployment_profile_size:
                    default: small
                    description: 'ScDeploymentProfileSize specifies the CloudPak profile
                      size. Possible values: small, medium, large.'
                    enum:
                    - small
                    - medium
                    - large
                    - entry
                    type: string
                  sc_deployment_type:
                    default: Production
                    description: 'ScDeploymentType specifies the deployment type.
                      Possible values: Starter, Production.'
                    enum:
                    - Starter
                    - Production
                    type: string
                  sc_enable_pdb:
                    default: true
                    description: |-
                      ScEnablePdb enables or disables Pod Disruption Budget creation for all components (ai, api, page, result, watch).
                      Individual components can override this flag via their own enable_pdb field. Default is true.
                    type: boolean
                  sc_generate_sample_network_policies:
                    description: |-
                      ScGenerateSampleNetworkPolicies enables creation of sample network policy templates for CP4A components.
                      Set to true only if you plan to use restricted network policies. Default is false.
                    type: boolean
                  sc_image_repository:
                    description: ScImageRepository is the shared docker image repository
                      for all CP4A components (e.g. cp.icr.io).
                    type: string
                  sc_ingress_tls_secret_name:
                    description: |-
                      ScIngressTLSSecretName is the name of the TLS secret used by the Kubernetes Ingress controller.
                      Required when sc_route_ingress_enable is true and sc_deployment_platform is other.
                    type: string
                  sc_is_multiple_az:
                    default: true
                    description: |-
                      ScIsMultipleAz enables pod spreading across multiple availability zones when set to true.
                      Default is true.
                    type: boolean
                  sc_route_ingress_annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      ScRouteIngressAnnotations are custom annotations added to the Route or Ingress resource.
                      If not set, default haproxy annotations are used for Routes.
                    type: object
                  sc_route_ingress_enable:
                    default: false
                    description: |-
                      ScRouteIngressEnable enables creation of an OpenShift Route (OCP/ROKS) or Kubernetes Ingress (other).
                      Default is false. When true, the operator creates the appropriate ingress resource
                      based on sc_deployment_platform.
                    type: boolean
                  sc_security_context:
                    description: |-
                      SecurityContext defines all pod-level security context settings applied to every
                      IBM Content Cortex AI Services pod. Groups run_as_user, fs_group, supplemental_groups,
                      fs_groupchangepolicy, selinux_options, and seccomp_profile into a single block.
                    properties:
                      fs_group:
                        description: |-
                          FsGroup is a supplemental group ID applied to all containers. Used to grant group
                          ownership of mounted volumes (e.g. Google Filestore on GKE).
                        format: int64
                        type: integer
                      fs_groupchangepolicy:
                        description: |-
                          FsGroupChangePolicy controls how the kubelet changes ownership of a volume's
                          files when it is mounted. Valid values: Always, OnRootMismatch.
                        enum:
                        - Always
                        - OnRootMismatch
                        type: string
                      run_as_user:
                        description: |-
                          RunAsUser specifies the UID to run all container processes.
                          Not supported on OCP and ROKS. Optional on non-OCP platforms.
                        format: int64
                        type: integer
                      seccomp_profile:
                        description: |-
                          SeccompProfile defines the seccomp profile applied to all containers.
                          The default profile is RuntimeDefault on OCP 4.11 (k8s v1.24) or higher.
                          NOTE: A custom Localhost profile stricter than RuntimeDefault may cause pods to fail.
                        properties:
                          localhost_profile:
                            description: |-
                              LocalhostProfile is the local path of a custom seccomp profile when Type is Localhost.
                              The custom profile must exist locally on all worker nodes (e.g. /profiles/fine-grained.json).
                            type: string
                          type:
                            description: Type of seccomp profile to apply.
                            enum:
                            - RuntimeDefault
                            - Localhost
                            - Unconfined
                            type: string
                        type: object
                      selinux_options:
                        description: SeLinuxOptions sets the SELinux context applied
                          to all containers.
                        properties:
                          level:
                            description: Level is SELinux level label that applies
                              to the container.
                            type: string
                          role:
                            description: Role is a SELinux role label that applies
                              to the container.
                            type: string
                          type:
                            description: Type is a SELinux type label that applies
                              to the container.
                            type: string
                          user:
                            description: User is a SELinux user label that applies
                              to the container.
                            type: string
                        type: object
                      supplemental_groups:
                        description: |-
                          SupplementalGroups is a list of additional group IDs applied to each container's
                          first process, in addition to the container's primary GID.
                        items:
                          format: int64
                          type: integer
                        type: array
                    type: object
                  storage_configuration:
                    description: StorageConfiguration defines the storage class names
                      for slow, medium, and fast storage.
                    properties:
                      sc_fast_file_storage_classname:
                        description: Storage class name for fast file storage (e.g.
                          managed-nfs-storage).
                        type: string
                      sc_medium_file_storage_classname:
                        description: Storage class name for medium file storage.
                        type: string
                      sc_slow_file_storage_classname:
                        description: Storage class name for slow file storage.
                        type: string
                    type: object
                required:
                - sc_ccx_license_model
                type: object
            required:
            - appVersion
            - license
            - shared_configuration
