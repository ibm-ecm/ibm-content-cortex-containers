                                description: |-
                                  PoliciesPodsPeriodSeconds defines how often (in seconds) the HPA may apply a scaling action.
                                  Defaults to 15.
                                format: int32
                                type: integer
                              policies_pods_value:
                                description: |-
                                  PoliciesPodsValue is the maximum number of pods the HPA may add/remove per PoliciesPodsPeriodSeconds.
                                  Defaults to 1.
                                format: int32
                                type: integer
                              stabilization_window_seconds:
                                description: |-
                                  StabilizationWindowSeconds is the cooldown window before a scaling action is applied.
                                  Default: 30 for scaleup, 300 for scaledown.
                                format: int32
                                type: integer
                            type: object
