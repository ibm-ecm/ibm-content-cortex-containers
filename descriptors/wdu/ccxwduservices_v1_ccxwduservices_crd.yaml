                        type: object
                      custom_labels:
                        additionalProperties:
                          type: string
                        description: CustomLabels are additional key/value labels
                          applied to ai pods and resources.
                        type: object
                      enable_pdb:
                        description: |-
                          EnablePdb overrides shared_configuration.sc_enable_pdb for the ai component.
                          A PDB is created with minAvailable: 1 if replica_count > 1, otherwise minAvailable: 0.
                          When nil, the value of sc_enable_pdb is used.
                        type: boolean
                      node_affinity:
                        description: NodeAffinity defines optional node affinity for
                          ai pods.
                        properties:
