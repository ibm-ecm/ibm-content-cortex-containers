          status:
            description: CCXWDUServicesStatus defines the observed state of CCXWDUServices.
            properties:
              componentStatuses:
                additionalProperties:
                  description: ComponentStatus describes the observed state of a single
                    WDU component (ai, api, page, result, watch).
                  properties:
                    desiredReplicas:
                      description: DesiredReplicas is the configured desired number
                        of pods.
                      format: int32
                      type: integer
                    message:
                      description: Message contains a human-readable description of
                        the current component state.
                      type: string
                    phase:
                      description: Phase is the current lifecycle phase of the component
                        (e.g. Pending, Running, Degraded, Failed).
                      type: string
                    readyReplicas:
                      description: ReadyReplicas is the number of pods that are currently
                        ready.
                      format: int32
                      type: integer
                  required:
                  - desiredReplicas
                  - readyReplicas
                  type: object
                description: |-
                  ComponentStatuses maps each WDU component name (ai, api, page, result, watch)
                  to its observed status.
                type: object
              conditions:
                description: Conditions reflect the latest available observations
                  of the CCXWDUServices state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
