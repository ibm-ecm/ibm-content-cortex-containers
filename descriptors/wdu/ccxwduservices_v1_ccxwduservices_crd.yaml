                      auto_scaling:
                        description: |-
                          AutoScaling defines HPA settings for the ai component.
                          These settings take priority over the global auto_scaling in ccx_wdu_configuration.
                        properties:
                          enabled:
                            description: Enabled activates HPA for this component.
                            type: boolean
                          max_replicas:
                            description: MaxReplicas is the maximum number of replicas.
                              Required when Enabled is true.
                            format: int32
                            type: integer
                          min_replicas:
                            description: MinReplicas is the minimum number of replicas.
                              Required when Enabled is true.
