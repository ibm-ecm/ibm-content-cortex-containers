                              description: NodeSelectorMatchExpression defines a single
                                node selector requirement.
                              properties:
                                key:
                                  description: Key is the label key that the selector
                                    applies to.
                                  type: string
                                operator:
                                  description: Operator represents a key's relationship
                                    to a set of values.
                                  enum:
                                  - In
                                  - NotIn
                                  - Exists
                                  - DoesNotExist
                                  type: string
                                values:
                                  description: Values is an array of string values.
                                    Required for In and NotIn operators.
                                  items:
                                    type: string
                                  type: array
                              required:
                              - key
                              - operator
                              type: object
                            type: array
                        type: object
                      replica_count:
                        description: ReplicaCount overrides the default number of
                          ai pods.
                        format: int32
                        type: integer
                      resources:
                        description: Resources defines compute resource limits and
                          requests for ai pods.
                        properties:
                          limits:
                            additionalProperties:
                              type: string
                            description: Limits is the maximum amount of compute resources
                              allowed.
                            type: object
                          requests:
                            additionalProperties:
                              type: string
                            description: Requests is the minimum amount of compute
                              resources required.
                            type: object
                        type: object
                      rolling_update:
                        description: RollingUpdate defines rolling update strategy
                          for the ai deployment.
                        properties:
                          max_surge:
                            default: 25%
                            description: MaxSurge is the maximum number of pods that
                              can be scheduled above the desired number.
                            type: string
                          max_unavailable:
                            default: 25%
                            description: MaxUnavailable is the maximum number of pods
                              that can be unavailable during the update.
                            type: string
                        type: object
                      tolerations:
                        description: Tolerations allow the ai pods to be scheduled
                          on nodes with matching taints.
                        items:
                          description: |-
                            The pod this Toleration is attached to tolerates any taint that matches
                            the triple <key,value,effect> using the matching operator <operator>.
                          properties:
                            effect:
                              description: |-
                                Effect indicates the taint effect to match. Empty means match all taint effects.
                                When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                              type: string
                            key:
                              description: |-
                                Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                              type: string
                            operator:
                              description: |-
                                Operator represents a key's relationship to the value.
                                Valid operators are Exists and Equal. Defaults to Equal.
                                Exists is equivalent to wildcard for value, so that a pod can
                                tolerate all taints of a particular category.
                              type: string
                            tolerationSeconds:
                              description: |-
                                TolerationSeconds represents the period of time the toleration (which must be
                                of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                                it is not set, which means tolerate the taint forever (do not evict). Zero and
                                negative values will be treated as 0 (evict immediately) by the system.
                              format: int64
                              type: integer
                            value:
                              description: |-
                                Value is the taint value the toleration matches to.
                                If the operator is Exists, the value should be empty, otherwise just a regular string.
                              type: string
