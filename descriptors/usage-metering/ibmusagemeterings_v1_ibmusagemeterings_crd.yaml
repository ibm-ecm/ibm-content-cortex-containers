                    Different mappingIds reporting the same metric for the same component should
                    define consistent processing, otherwise the payload with processing different than already
                    received previously will be treated as invalid and not processed.
                    The component is identified by (instanceId, productId) pair.
                    If mappingId is provided, then method field and sources section should not be defined.
                    If mappingId is not provided, the metrics is not being reported by a component,
                    but rather it's being calculated based on other metrics reported to UMS. In such case,
                    method field and sources section needs to be specified.
                  pattern: ^[a-zA-Z0-9_-]{1,128}$
                  type: string
                method:
                  description: |-
                    Optional method for calculating a new metric based on other metrics present in UMS.
                    If this field is set, the mappingId field must not be provided, and the sources section must be specified.
                    Supported methods:
                      - "RATIO_SUM": sums all metrics referenced in the sources section, applying the specified ratios.
                      - "RATIO_SUM_STEPWISE": performs a stepwise ratio-based summation of the referenced metrics.
                    Defaults to "RATIO_SUM" if not specified.
                  type: string
                processing:
                  description: |-
                    Depending on the processing field the stored value is updated as follows: if processing is 'ADD',
                    then the currently received value is added to the stored value, if processing is 'LAST',
                    then the currently received value overrides the stored value, if processing is 'MAX',
                    then the currently received value overrides the stored value only in case the stored value
                    is lower and if processing is 'COUNT' then the currently received value is ignored and
                    the stored value is incremented by one. If the value is broken down into groups/tenants, currently
                    received value and the stored value are compared for each group/tenant independently. Defaults to 'MAX'.
                  type: string
                sources:
                  description: |-
                    The sources section define the metrics based on which to calculate the new metric according
                    to the rules defined by the method field.
                  items:
                    description: Source metric details to use when calculating the new metric.
                    properties:
                      instanceId:
                        description: |-
                          Optional instance ID which uniquely idetifies the instance of the installed product.
                          Defaults to the namespace in which Usage Metering Service is installed.
                        pattern: ^[a-zA-Z0-9-]{1,255}$
                        type: string
                      metricName:
                        description: |-
                          Name of the metric based on which the new metric is being calculated.
                          Defaults to the metric name defined in the data section of the CR/payload.
                        pattern: ^.{1,255}$
                        type: string
                      parameters:
                        additionalProperties:
                          description: Parameter name used in the algorithm to calculate new metric based on the algorithm sepcified in the method field.
                          pattern: ^.{1,255}$
                          type: string
                        description: Parameters needed for the algorithm used in calculation of the new metric defined by the method field.
                        type: object
                      productId:
                        description: |-
                          Product ID obtained by the product when going through the Readiness process,
                          based on which the new metric is calculated.
                          Defaults to the product ID defined in the data section of the CR/payload.
                        pattern: ^$|^[0-9a-fA-F]{1,32}$
                        type: string
                      productName:
                        description: |-
                          Product name corresponding to the productId field.
                          Defaults to the product name defined in the data section of the CR/payload.
                        pattern: ^.{1,255}$
                        type: string
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  type: array
              type: object
              x-kubernetes-preserve-unknown-fields: true
              x-kubernetes-validations:
                - message: cannot specify mappingId together with method or sources
                  rule: (!has(self.mappingId) || self.mappingId == "") || ((!has(self.method) || self.method == "") && (!has(self.sources) || size(self.sources) == 0))
                - message: must specify either mappingId or sources
                  rule: (has(self.mappingId) && self.mappingId != "") || (has(self.sources) && size(self.sources) > 0)
                - message: sources are required when method is specified
                  rule: (!has(self.method) || self.method == "") || (has(self.sources) && size(self.sources) > 0)
                - message: breakdownDefs must not be provided when mappingId is not specified
