apiVersion: operator.ibm.com/v1
kind: IBMServiceMeterDefinition
metadata:
  name: cp4ba-ccx-premium-cpe-user-metrics
  namespace: REPLACE_NAMESPACE
spec:
  mappingId: cpedeployment000000000001
  processing: LAST
  repeat: true
  breakdownDefs:
    - breakdownBy:
        name: INSTANCE_COUNT
      groupBy:
        - componentId
        - componentName
        - version
        - environment
        - architecture
        - platform
        - java_rpc_calls
        - dot_net_rpc_calls
        - css_objects_indexed
        - es_os_objects_created
        - db2_db_count
        - oracle_db_count
        - mssql_db_count
        - postgresql_db_count
        - asa_write_bytes
        - fcd_fcps_in_use
        - document_creates
        - propertytemplate_creates
        - choicelist_creates
        - folder_creates
        - sweep_creates
        - execute_changes_calls
        - execute_search_calls
        - get_content_calls
        - get_objects_calls
        - get_search_metadata_calls
        - put_content_calls
      source: metricQuantity
      processing: LAST
  data:
    componentId: 7ab1213e53cf4260a247c75f16c2569d
    componentName: IBM Content Platform Engine
    productId: 41ce887b910b403989f7fc004857f4d3
    productName: IBM Content Cortex Premium Containers - CP4BA - User
    metricName: INSTANCE_COUNT
    metricDescription: count of CPE instances
    metricType: ADOPTION
