apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    productID: 068a62892a1e4db39641342e592daa25
    productMetric: FREE
    productName: IBM Cloud Platform Common Services
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ibm-usage-metering-operator
    control-plane: controller-manager
    component-id: ibm-usage-metering
  name: ibm-usage-metering-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: ibm-usage-metering-operator
        productID: 068a62892a1e4db39641342e592daa25
        productMetric: FREE
        productName: IBM Cloud Platform Common Services
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: ibm-usage-metering-operator
        control-plane: controller-manager
        intent: projected
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - s390x
                - ppc64le
            weight: 3
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - s390x
                - ppc64le
      securityContext:
        runAsNonRoot: true
        # Uncomment to specify the RunAsUser for the security context of the pod.
        # This is usually a numeric value that corresponds to a user ID.
        # runAsUser: 1001
        # Uncomment to specify the fsGroup for the security context of the pod.
        # fsGroup: 0
        # Uncomment this to enable seccomp profile on OCP 4.12+
        # seccompProfile:
        #   type: RuntimeDefault
      containers:
        - args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          command:
            - ibm-usage-metering-operator
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERAND_NAMESPACES
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: IBM_USAGE_METERING_OPERAND_IMAGE
              value: icr.io/cpopen/cpfs/ibm-usage-metering-instance@sha256:81946b523bc9671e9ab476303c8de261f1975e06db9f6aea41502b7c01408c3f
            - name: ENABLE_ROUTES
              value: "true"
          image: icr.io/cpopen/ibm-usage-metering-operator@sha256:1318d9e4ebc22ea48fc1c8182e59d09fd121889a37b11b68b979cd55c0ab75c0
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: ibm-usage-metering-operator
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 280Mi
              memory: 128Mi
            requests:
              cpu: 10m
              ephemeral-storage: 50Mi
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      serviceAccountName: ibm-usage-metering-operator
      terminationGracePeriodSeconds: 10

      imagePullSecrets:
        - name: ibm-entitlement-key
