apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    productID: 068a62892a1e4db39641342e592daa25
    productMetric: FREE
    productName: IBM Cloud Platform Common Services
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ibm-usage-metering-operator
    control-plane: controller-manager
    component-id: ibm-usage-metering
  name: ibm-usage-metering-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: ibm-usage-metering-operator
        productID: 068a62892a1e4db39641342e592daa25
        productMetric: FREE
        productName: IBM Cloud Platform Common Services
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: ibm-usage-metering-operator
        control-plane: controller-manager
        intent: projected
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - s390x
                - ppc64le
            weight: 3
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - s390x
                - ppc64le
      securityContext:
        runAsNonRoot: true
        # Uncomment to specify the RunAsUser for the security context of the pod.
        # This is usually a numeric value that corresponds to a user ID.
        # runAsUser: 1001
        # Uncomment to specify the fsGroup for the security context of the pod.
        # fsGroup: 0
        # Uncomment this to enable seccomp profile on OCP 4.12+
        # seccompProfile:
        #   type: RuntimeDefault
      containers:
        - args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          command:
            - ibm-usage-metering-operator
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERAND_NAMESPACES
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: IBM_USAGE_METERING_OPERAND_IMAGE
              value: icr.io/cpopen/cpfs/ibm-usage-metering-instance@sha256:8f5cc6cef986e7147f6fa6e6bd92d5f405571535ea578e0ec280f70e322a69b2
            - name: IBM_LICENSE_SERVICE_OPERAND_IMAGE
              value: icr.io/cpopen/cpfs/ibm-licensing:4.2.24
            - name: ENABLE_ROUTES
              value: "true"
          image: icr.io/cpopen/ibm-usage-metering-operator@sha256:9e98289b59a0b3d6c3b2c61fd3b6efb2e15c6b2f6c78dc51a4ee87a2829300e7
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: ibm-usage-metering-operator
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 280Mi
              memory: 128Mi
            requests:
              cpu: 10m
              ephemeral-storage: 50Mi
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
                - CAP_NET_RAW
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 10
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 4
            periodSeconds: 4
            timeoutSeconds: 3
      securityContext:
        runAsNonRoot: true
      serviceAccountName: ibm-usage-metering-operator
      terminationGracePeriodSeconds: 10

      imagePullSecrets:
        - name: ibm-entitlement-key
