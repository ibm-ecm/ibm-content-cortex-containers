## Webhook Service for ibm-pg-operator.
## This service exposes the admission webhook endpoints (port 9443) used by
## the MutatingWebhookConfiguration and ValidatingWebhookConfiguration.
apiVersion: v1
kind: Service
metadata:
  labels:
    component-id: ibm-pg-operator
    icpdsupport/addOnId: ibm-pg-operator
    icpdsupport/app: database
    icpdsupport/module: ibm-pg-operator
  name: ibm-pg-webhook-service
spec:
  ports:
  - port: 443
    targetPort: 9443
  selector:
    app.kubernetes.io/name: ibm-pg-operator
