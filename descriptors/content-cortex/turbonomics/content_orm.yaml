apiVersion: devops.turbonomic.io/v1alpha1
kind: OperatorResourceMapping
metadata:
  name: content-orm
  namespace: {{ placeholder_namespace }}
spec:
  mappings:
    patterns:
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: cpe
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-cpe-deploy")].resources
        ownerPath: .spec.ecm_configuration.cpe.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: css1
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-css-deploy-1")].resources
        ownerPath: .spec.ecm_configuration.css.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: css2
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-css-deploy-2")].resources
        ownerPath: .spec.ecm_configuration.css.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: cmis
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-cmis-deploy")].resources
        ownerPath: .spec.ecm_configuration.cmis.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          path: '.spec.template.spec.containers[?(@.name=="content-es-deploy")].resources'
          selector: es
        ownerPath: .spec.ecm_configuration.es.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: tm
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-tm-deploy")].resources
        ownerPath: .spec.ecm_configuration.tm.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: graphql
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-graphql-deploy")].resources
        ownerPath: .spec.ecm_configuration.graphql.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: ccxmo
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-ccxmo-deploy")].resources
        ownerPath: .spec.ccxmo_configuration.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: navigator
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-navigator-deploy")].resources
        ownerPath: .spec.navigator_configuration.resources
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: ier
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-ier-deploy")].resources
        ownerPath: .spec.ier_configuration.resources
      # ICCSAP base instance
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: iccsap-base
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-iccsap-deploy")].resources
        ownerPath: .spec.iccsap_configuration.resources
      # ICCSAP multi-instance 0 - replace <INSTANCE_ID_1> with your instance_id from iccsap_configuration_multi
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: iccsap-multi-0
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-iccsap-<INSTANCE_ID_1>-deploy")].resources
        ownerPath: .spec.iccsap_configuration_multi[0].resources
      # ICCSAP multi-instance 1 - replace <INSTANCE_ID_2> with your instance_id from iccsap_configuration_multi
      - owned:
          apiVersion: apps/v1
          kind: Deployment
          selector: iccsap-multi-1
          path: .spec.template.spec.containers[?(@.name=="{{ meta.name }}-iccsap-<INSTANCE_ID_2>-deploy")].resources
        ownerPath: .spec.iccsap_configuration_multi[1].resources
    selectors:
      cpe:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-cpe-deploy
      css1:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-css-deploy-1
      css2:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-css-deploy-2
      cmis:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-cmis-deploy
      es:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-es-deploy
      graphql:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-graphql-deploy
      tm:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-tm-deploy
      ccxmo:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-ccxmo-deploy
      navigator:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-navigator-deploy
      ier:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-ier-deploy
      iccsap-base:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-iccsap-deploy
      iccsap-multi-0:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-iccsap-<INSTANCE_ID_1>-deploy
      iccsap-multi-1:
        matchLabels:
          app.kubernetes.io/name: {{ meta.name }}-iccsap-<INSTANCE_ID_2>-deploy
  owner:
    apiVersion: fncm.ibm.com/v1
    kind: FNCMCluster
    name: {{ meta.name }}
