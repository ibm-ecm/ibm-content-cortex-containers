<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="100" height="40">
  <!-- IBM Bob logo — IBM blue with robot head icon -->
  <!-- Robot head mark -->
  <rect x="4" y="8" width="22" height="20" rx="4" fill="#0f62fe"/>
  <!-- Eyes -->
  <rect x="8" y="14" width="5" height="5" rx="1" fill="#fff"/>
  <rect x="17" y="14" width="5" height="5" rx="1" fill="#fff"/>
  <!-- Mouth/grill -->
  <rect x="8" y="22" width="14" height="2" rx="1" fill="#fff" opacity="0.7"/>
  <!-- Antenna -->
  <rect x="14" y="4" width="2" height="5" rx="1" fill="#0f62fe"/>
  <circle cx="15" cy="3" r="2" fill="#0f62fe"/>
  <!-- Wordmark -->
  <text x="32" y="28" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="20" font-weight="600" fill="#0f62fe" letter-spacing="-0.3">Bob</text>
</svg>
