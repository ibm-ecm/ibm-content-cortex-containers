# ####################################################
# ##                  Namespace                     ##
# ####################################################

# The value can't be empty or any of these -> "services","default","calico-system","ibm-cert-store","ibm-observe","ibm-system","ibm-odf-validation-webhook"
# The value also can't start from openshift or kube

NAMESPACE = "<Required>"

# ####################################################
# ##              License and Platform              ##
# ####################################################

# Choose the licensing model for the Product you are installing.
# Valid values:
#   IBM Content Cortex Essentials:           CCx.Ess.AU | CCx.Ess.EP | CCx.EE
#   IBM Content Cortex Premium:              CCx.Pre.AU | CCx.Pre.EP | CCx.Pre.PE
#   IBM Content Cortex Restricted:           CCx.AR | CCx.PR | CCx.ER
#   Cloud Pak for Business Automation:       CP4BA.NonProd | CP4BA.Prod | CP4BA.User
#   CP4BA Premium Add-On (exactly one):      CCx.CP4BA.NonProd.Premium | CCx.CP4BA.Prod.Premium | CCx.CP4BA.User.Premium
#
# Note: CP4BA.* and CCx.CP4BA.*.Premium values are mutually exclusive.
LICENSE = "<Required>"

# Kubernetes platform type - Valid values: [OCP; CNCF]
# OCP  - OpenShift Container Platform (uses Routes, ingress not needed)
# CNCF - Cloud Native Computing Foundation / standard Kubernetes (requires ingress)
PLATFORM = "OCP"

# Do you want to configure ingress - Valid values: [true; false]
# Only applicable when PLATFORM = "CNCF"
INGRESS = false

# ####################################################
# ##       Authentication and Authorization         ##
# ####################################################

# Authentication type - Valid values: [1; 2; 3]
# 1. LDAP
# 2. LDAP_IDP
# 3. SCIM_IDP
AUTHENTICATION = 1

# Do you want the operator to generate network policies templates for the deployment - Valid values: [true; false]
# Applicable for version 5.7.0 and above
GENERATE_NETWORK_POLICIES = false

# Enable/disable FIPS mode for the deployment (default value is "false")
FIPS_SUPPORT = false

# Secret management method for the deployment.
# Valid values: ["kubernetes"; "vault"]
#   "kubernetes" - Native Kubernetes Secrets stored in etcd (default, no extra infrastructure required)
#   "vault"      - HashiCorp Vault via the Secrets Store CSI Driver
#                  When set to "vault", configure VAULT_URL in the generated
#                  propertyFile/<namespace>/ccx-deployment.toml before running generate mode.
SECRET_MANAGEMENT = "kubernetes"

# ####################################################
# ##              Optional Components               ##
# ####################################################

# Deploy Content Search Services (CSS).
CSS = false

# Deploy Content Management Interoperability Services (CMIS).
CMIS = false

# Deploy Task Manager (TM).
TM = false

# Deploy Content Platform Engine (CPE).
CPE = true

# Deploy GraphQL (GRAPHQL).
GRAPHQL = true

# Deploy Navigator (BAN).
BAN = true

# Deploy External Share (ES).
ES = false

# Deploy IBM Enterprise Records (IER).
IER = false

# Deploy IBM Content Collector for SAP (ICCSAP).
ICCSAP = false

# Deploy IBM Content Cortex for Microsoft Office (CCXMO).
CCXMO = false

# ####################################################
# ##         Optional Add-On Operators              ##
# ####################################################

# Deploy Enhanced Extraction (WDU) operator.
# Automatically enables DEPLOY_CNPG when set to true.
DEPLOY_ENHANCED_EXTRACTION = false

# Deploy Model Gateway operator.
# Automatically enables DEPLOY_CNPG and DEPLOY_REDIS when set to true.
DEPLOY_MODEL_GATEWAY = false

# ####################################################
# ##           Common Database Properties           ##
# ####################################################

# Provide the database type from your infrastructure. - Valid values: [1; 2; 3; 4; 5; 6; 7]
# 1. IBM Db2
# 2. IBM Db2 HADR
# 3. Microsoft SQL Server
# 4. PostgreSQL
# 5. Oracle
# 6. IBM Db2 RDS
# 7. IBM Db2 RDS HADR
DATABASE_TYPE = 1

# Is ssl enabled for this database - Valid values: [true; false]
DATABASE_SSL_ENABLE = true

# Number of object stores to use - Valid values: [1; 2; 3; 4...]
DATABASE_OBJECT_STORE_COUNT = 1

# ####################################################
# ##          Custom Component Properties           ##
# ####################################################

# Java Send Mail Support
# Valid values: [true; false]
SENDMAIL_SUPPORT = false

# ICC for Email
# Valid values: [true; false]
ICC_SUPPORT = false

# Custom Task Manager Users and Groups
# Valid values: [true; false]
TM_CUSTOM_GROUP_SUPPORT = false

# ####################################################
# ##              Content Init/Verify               ##
# ####################################################

# Initialize Content - Valid values: [true; false]
CONTENT_INIT = true

# Verify Content - Valid values: [true; false]
CONTENT_VERIFY = true

# ####################################################
# ##                 LDAP Properties                ##
# ####################################################

# If Authentication type includes LDAP, provide the following properties.
[LDAP]
# The type of LDAP server -  Valid values: [1,2,3,4,5,6,7]
# 1. Microsoft Active Directory
# 2. IBM Security Verify Directory
# 3. NetIQ eDirectory
# 4. Oracle Internet Directory
# 5. Oracle Directory Server Enterprise Edition
# 6. Oracle Unified Directory
# 7. CA eTrust
LDAP_TYPE = 2

# Enable SSL for LDAP connection. - Valid values: [true; false]
LDAP_SSL_ENABLE = true

# Additional LDAP's - uncomment the section below by removing the leading '#' and space
# Change 'LDAPx' to 'LDAP2' for a second LDAP, 'LDAP3' for a third and so on...
# [LDAPx]
# LDAP_TYPE=
# LDAP_SSL_ENABLE=

# ####################################################
# ##           Identity Provider Properties         ##
# ####################################################

# If Authentication type includes IDP, provide the following properties.
[IDP]
# Set to true if the IDP provides a discovery endpoint url. - Valid values: [true; false]
DISCOVERY_ENABLED = true

# The discovery endpoint url must end with '/.well-known/openid-configuration'
DISCOVERY_URL = "<Required>"

# Additional IDP's - uncomment the section below by removing the leading '#' and space
# Change 'IDPx' to 'IDP2' for a second IDP, 'IDP3' for a third and so on...
# [IDPx]
# DISCOVERY_ENABLED=
# DISCOVERY_URL=

# ####################################################
# ##         AI Services Provider Configuration     ##
# ####################################################

# Configure up to 5 AI model providers for this deployment.
# Only PROVIDER_TYPE is consumed by the silent install — it determines which
# property file template is generated for you to fill in credentials and model IDs.
# All credential fields (API_KEY, URL, MODEL, etc.) are written into the
# generated propertyFile/<namespace>/ccx-ai-services.toml.
#
# Not required when DEPLOY_MODEL_GATEWAY = true — Model Gateway is
# auto-selected as the provider in that case.
#
# Valid values for PROVIDER_TYPE:
#   WATSONX_SAAS       — IBM WatsonX.ai SaaS
#   WATSONX_LWE        — IBM WatsonX.ai Lightweight Engine (on-premise)
#   MICROSOFT_FOUNDRY  — Microsoft Azure AI Foundry

# First provider (required when AI Services is deployed without Model Gateway)
[PROVIDER_1]
PROVIDER_TYPE = "WATSONX_SAAS"

# Second provider (optional) — uncomment and set PROVIDER_TYPE to enable
# [PROVIDER_2]
# PROVIDER_TYPE = "WATSONX_SAAS"

# Third provider (optional)
# [PROVIDER_3]
# PROVIDER_TYPE = "WATSONX_SAAS"

# Fourth provider (optional)
# [PROVIDER_4]
# PROVIDER_TYPE = "WATSONX_SAAS"

# Fifth provider (optional)
# [PROVIDER_5]
# PROVIDER_TYPE = "WATSONX_SAAS"

# ####################################################
# ##            Model Gateway Properties            ##
# ####################################################

# If DEPLOY_MODEL_GATEWAY = true above, provide the following properties.
[MODEL_GATEWAY]

# Use IBM-managed CNPG for Model Gateway.
# true  — ibm-pg-cluster-mg CR is generated; postgres.HOSTNAME, postgres.USERNAME,
#          and postgres.PASSWORD in ccx-model-gateway.toml are auto-filled.
# false — fill in postgres.HOSTNAME, postgres.USERNAME, postgres.PASSWORD
#          in ccx-model-gateway.toml manually.
# Valid values: [true; false]
USE_IBM_CNPG = false

# Use IBM-managed Redis for Model Gateway.
# true  — redispwdsecret.yaml and ibm_redis_cr.yaml are generated;
#          redis.HOSTNAME and redis.PASSWORD in ccx-model-gateway.toml are auto-filled.
# false — fill in redis.HOSTNAME and redis.PASSWORD in ccx-model-gateway.toml manually
#          (or leave redis.ENABLED = false to disable Redis entirely).
# Valid values: [true; false]
USE_IBM_REDIS = false

# Block-mode storage class for IBM-managed CNPG and Redis PVCs (ReadWriteOnce).
# Required when USE_IBM_CNPG = true or USE_IBM_REDIS = true.
# Run `kubectl get storageclass` to list available classes.
# Common values:
#   ocs-storagecluster-ceph-rbd  (ODF/OCS)
#   ibmc-block-gold              (IBM Cloud)
#   standard                     (Kind/local)
BLOCK_STORAGE_CLASSNAME = "<Required>"

# Enable SSL for the external Model Gateway PostgreSQL connection.
# Only used when USE_IBM_CNPG = false.
# When omitted, falls back to the top-level DATABASE_SSL_ENABLE value.
# Valid values: [true; false]
# MG_PG_SSL = false

# Number of CNPG PostgreSQL instances for Model Gateway. Valid values: [1; 3]
# Only used when USE_IBM_CNPG = true.
CNPG_INSTANCES = 1

# Size of each CNPG data volume for Model Gateway (e.g. "10Gi").
# Only used when USE_IBM_CNPG = true.
CNPG_STORAGE_SIZE = "10Gi"

# ####################################################
# ##     Enhanced Extraction (WDU) Properties       ##
# ####################################################

# If DEPLOY_ENHANCED_EXTRACTION = true above, provide the following properties.
[WDU]

# Use IBM-managed CNPG for Enhanced Extraction (WDU).
# true  — ccx-wdu-pg CR is generated; postgres.HOSTNAME, postgres.USERNAME,
#          and postgres.PASSWORD in ccx-wdu.toml are auto-filled.
# false — fill in postgres.HOSTNAME, postgres.USERNAME, postgres.PASSWORD
#          in ccx-wdu.toml manually.
# Valid values: [true; false]
USE_IBM_CNPG = false

# Block-mode storage class for IBM-managed CNPG PVCs (ReadWriteOnce).
# Required when USE_IBM_CNPG = true.
# Run `kubectl get storageclass` to list available classes.
# Common values:
#   ocs-storagecluster-ceph-rbd  (ODF/OCS)
#   ibmc-block-gold              (IBM Cloud)
#   standard                     (Kind/local)
BLOCK_STORAGE_CLASSNAME = "<Required>"

# Enable SSL for the external WDU PostgreSQL connection.
# Only used when USE_IBM_CNPG = false.
# When omitted, falls back to the top-level DATABASE_SSL_ENABLE value.
# Valid values: [true; false]
# WDU_PG_SSL = false

# Number of CNPG PostgreSQL instances for WDU. Valid values: [1; 3]
# Only used when USE_IBM_CNPG = true.
CNPG_INSTANCES = 1

# Size of each CNPG data volume for WDU (e.g. "10Gi").
# Only used when USE_IBM_CNPG = true.
CNPG_STORAGE_SIZE = "10Gi"

# Enable KVP with WatsonX AI for Enhanced Extraction (WDU) - Valid values: [true; false]
# When true: fill in the [wxai] section in the generated
#   propertyFile/<namespace>/ccx-wdu.toml with your watsonx.ai credentials
#   (API key, space IDs, model IDs) before running generate mode.
ENABLE_WXAI = false
