apiVersion: operator.ibm.com/v1
kind: IBMServiceMeterDefinition
metadata:
  name: {% if license_prefix == 'cp4ba' %}cp4ba-graphql-metrics{% else %}ccx-{{ license_prefix }}-graphql-metrics-prod{% endif %}

  namespace: {{ namespace }}
{% if license_prefix != 'cp4ba' %}  labels:
    ccx.ibm.com/backup-type: mandatory
{% endif %}spec:
  mappingId: graphqldeployment000000000001
  processing: LAST
  repeat: true
  breakdownDefs:
    - breakdownBy:
        name: INSTANCE_COUNT
      groupBy:
        - componentId
        - componentName
        - version
        - environment
        - architecture
        - platform
        - graphql_calls
      source: metricQuantity
      processing: LAST
  data:
    componentId: {{ data.componentId }}
    componentName: {{ data.componentName }}
    productId: {{ data.productId }}
    productName: {{ data.productName }}
    metricName: {{ data.metricName }}
    metricDescription: {{ data.metricDescription }}
    metricType: {{ data.metricType }}

