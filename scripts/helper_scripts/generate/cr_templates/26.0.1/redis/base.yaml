###############################################################################
## IBM Redis CR — generated by prerequisites.py
## Apply AFTER the Redis operator is running AND ibm-redis-mg-secret exists.
## Wait for readiness before applying the Model Gateway CR:
##   kubectl get rediscp ibm-redis-mg -n <namespace> -w
##   Ready when: Status = "Ready"
###############################################################################
apiVersion: redis.ibm.com/v1
kind: Rediscp
metadata:
  name: ibm-redis-mg
spec:
  ## IBM license acceptance.
  license:
    accept: true

  ## Version of IBM Redis CP to deploy.
  version: "1.4.0"

  ## IBM Redis CP image repository pull secret.
  redis_image_pull_secret: "ibm-entitlement-key"

  ## Scale configuration.
  ## Valid values: small, medium, large, small_mincpureq, xlarge
  scale_config: "small"

  ## Number of Redis replicas.
  size: 3

  ## Number of HAProxy replicas.
  haproxy_replicas: 1

  ## Name of the TLS certificate secret (created by the operator).
  cert_name: "ibm-redis-mg-cert"

  ## Name of the pre-existing secret containing the Redis password.
  ## Must contain key: password
  ## Created automatically by prerequisites.py generate.
  credentialSecret: "ibm-redis-mg-secret"

  ## Storage classes for Redis persistent volumes.
  file_storage_class: "<Required>"
  block_storage_class: "<Required>"
