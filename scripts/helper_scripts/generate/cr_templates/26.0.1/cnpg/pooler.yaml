## IBM PostgreSQL Pooler CR — PgBouncer connection pooler template.
## Generated by prerequisites.py; do NOT edit the template directly.
##
## The Pooler manages a fleet of PgBouncer pods that multiplex client
## connections onto a smaller set of real PostgreSQL server connections,
## reducing load on the primary and improving connection scalability.
##
## Apply this AFTER the Cluster CR is in healthy state:
##   kubectl get clusters.pg.ibm.com <cluster-name> -n <namespace> -w
##
## For all available fields refer to the CRD schema or run:
##   kubectl explain poolers.postgresql.cnpg.io
apiVersion: pg.ibm.com/v1
kind: Pooler
metadata:
  ## Name of this Pooler instance — set at generation time.
  name: ibm-pg-pooler
  namespace: placeholder
spec:
  ## Target cluster — set at generation time to match the Cluster CR name.
  cluster:
    name: ibm-pg-cluster

  ## Number of PgBouncer pod replicas.
  instances: 1

  ## Route to the primary (read-write) instance.
  type: rw

  pgbouncer:
    parameters:
      ## Maximum number of server connections per (database, user) pair.
      default_pool_size: "10"

      ## Maximum total number of client connections accepted by PgBouncer.
      max_client_conn: "500"

    ## Set to true to pause new client connections during maintenance.
    paused: false

    ## transaction: server connection held only for duration of a transaction.
    ## session:     server connection held for full client session (needed for
    ##              advisory locks or SET LOCAL).
    poolMode: transaction
