###############################################################################
## IBM PostgreSQL Cluster CR — generated by prerequisites.py
## Apply AFTER the CNPG operator is running.
## Wait for readiness before applying the workload CR:
##   kubectl get clusters.pg.ibm.com <cluster-name> -n <namespace> -w
##   Ready when: Status = "Cluster in healthy state"  Ready = <instances>/<instances>
##
## NOTE: metadata.name, spec.bootstrap.initdb.database, and spec.storage.storageClass
##       are injected at generation time — do NOT edit the sentinel values below.
###############################################################################
apiVersion: pg.ibm.com/v1
kind: Cluster
metadata:
  ## Do not change the name of the cluster
  name: <CLUSTER_NAME>
  labels:
    app.kubernetes.io/name: ibm-pg-operator
    component-id: ibm-pg-operator
spec:
  ## Number of PostgreSQL instances (primary + replicas).
  ## 1 = development, 3 = production HA.
  instances: "1"

  ## PostgreSQL image. Must match an image available in the ImageCatalog
  ## The ImageCatalog is created by the CNPG operator and contains the images for the PostgreSQL version supported by the operator.
  imageCatalogRef:
    apiGroup: pg.ibm.com
    kind: ImageCatalog
    name: ibm-pg-operator-operand-image-catalog
    major: 17

  ## Image pull secret for operand images.
  imagePullSecrets:
    - name: ibm-entitlement-key

  ## Bootstrap: create the application database owned by the app user.
  ## The database name is unique per workload (modelgateway or wdu).
  ## CNPG only creates the default 'app' database without this block.
  bootstrap:
    initdb:
      database: <DATABASE_NAME>
      owner: app

  ## Storage for primary data volumes.
  storage:
    size: "10Gi"
    storageClass: "<Required>"
